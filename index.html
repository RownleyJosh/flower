<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="images/gift.png" type="image/x-icon">
  <link rel="stylesheet" href="css/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Volkhov&display=swap" rel="stylesheet">

  <!-- Document Title -->
  <title>I Have Something</title>
</head>

<body>
  <!-- Background -->
  <div class="night"></div>

  <!-- Title -->
  <h1 class="title"></h1>

  <!-- Button -->
  <div style="position: absolute; top: 60vh; width: 100%; display: flex; flex-direction: column; align-items: center;">
    <a href="flower.html" class="btn" id="play-music-btn">
      <svg height="24" width="24" fill="#FFFFFF" viewBox="0 0 24 24" data-name="Layer 1" id="Layer_1" class="sparkle">
        <path
          d="M10,21.236,6.755,14.745.264,11.5,6.755,8.255,10,1.764l3.245,6.491L19.736,11.5l-6.491,3.245ZM18,21l1.5,3L21,21l3-1.5L21,18l-1.5-3L18,18l-3,1.5ZM19.333,4.667,20.5,7l1.167-2.333L24,3.5,21.667,2.333,20.5,0,19.333,2.333,17,3.5Z">
        </path>
      </svg>
      <span class="text">Open</span>
    </a>
    <span style="margin-top: 10px; font-family: 'Volkhov', serif; color: white; font-size: 18px;">@jeff</span>
  </div>

  <!-- Background Music -->
  <audio id="bg-music" src="assets/music/background.mp3" loop></audio>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const audio = document.getElementById("bg-music");
      const playButton = document.getElementById("play-music-btn");

      playButton.addEventListener("click", function (event) {
        event.preventDefault(); // Ngăn không chuyển trang ngay lập tức
        window.location.href = "flower.html"; // Chuyển trang trước, nhạc sẽ phát sau trên trang mới
      });
    });
  </script>

  <script src="js/index.js"></script>
</body>

</html>
